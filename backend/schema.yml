components:
  schemas:
    ConfirmPayoutAccountChangeRequest:
      type: object
      properties:
        otp:
          type: string
          maxLength: 6
          minLength: 4
      required:
      - otp
    ConfirmPayoutAccountChangeResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/ProviderPayoutAccount'
      required:
      - data
      - message
    DispatchOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        service_request:
          allOf:
          - $ref: '#/components/schemas/ServiceRequest'
          readOnly: true
        provider:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 20
        offered_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - offered_at
      - provider
      - service_request
    InitiateCheckoutRequest:
      type: object
      properties:
        payment_intent_id:
          type: string
          format: uuid
          description: UUID of the pending PaymentIntent
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          default: BKASH
          description: |-
            Gateway choice

            * `BKASH` - bKash Tokenized
            * `SSLCOMMERZ` - SSLCommerz
            * `NAGAD` - Nagad Direct PGW
        callback_url:
          type: string
          format: uri
          description: Client redirect URL after transaction
      required:
      - callback_url
      - payment_intent_id
    InitiateCheckoutResponse:
      type: object
      properties:
        redirect_url:
          type: string
          description: Redirect payment gateway URL
        payment_id:
          type: string
          description: Gateway session reference
        order_id:
          type: string
        gateway_response:
          type: object
          additionalProperties: {}
      required:
      - redirect_url
    PatchedProviderProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        provider_type:
          type: string
          maxLength: 32
        verification_status:
          allOf:
