  /api/v1/payments/webhooks/bkash/:
    get:
      operationId: v1_payments_webhooks_bkash_retrieve
      description: 'bKash passes query params on redirect: paymentID, status, api_key.'
      summary: bKash tokenized gateway redirect callback
      parameters:
      - in: query
        name: paymentID
        schema:
          type: string
        description: bKash Payment ID
      - in: query
        name: status
        schema:
          type: string
        description: Transaction status
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/v1/payments/webhooks/nagad/:
    get:
      operationId: v1_payments_webhooks_nagad_retrieve
      description: |-
        Nagad invokes this endpoint on transaction completion or failure:
        GET /api/v1/payments/webhooks/nagad/?payment_ref_id=...&status=...
      summary: Nagad PGW redirect callback
      parameters:
      - in: query
        name: payment_ref_id
        schema:
          type: string
        description: Nagad Payment Reference ID
      - in: query
        name: status
        schema:
          type: string
        description: Transaction status (e.g. Success, Failed)
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
