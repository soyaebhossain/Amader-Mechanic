openapi: 3.0.3
info:
  title: Roadside Assistance BD API
  version: 1.0.0
  description: Modular Monolith API for roadside breakdown recovery in Bangladesh
paths:
  /api/v1/accounts/profile/:
    get:
      operationId: v1_accounts_profile_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_accounts_profile_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_accounts_profile_partial_update
      tags:
      - v1
      requestBody:
