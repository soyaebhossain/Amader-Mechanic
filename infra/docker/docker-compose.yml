version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: roadside_postgis
    restart: always
    environment:
      POSTGRES_DB: roadside_assistance_bd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: antigravity_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: roadside_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
